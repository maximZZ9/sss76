name: Build Windows installer

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer (NSIS + portable)
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = Get-Content ./build-log.txt -Tail 40
            for ($i = 0; $i -lt $tail.Count; $i += 8) {
              $j = [Math]::Min($i + 7, $tail.Count - 1)
              $part = ($tail[$i..$j] -join "`n") -replace '%', '%25'
              $part = $part -replace "`r", '' -replace "`n", '%0A'
              Write-Output "::error::$part"
            }
            "### Build failed - log tail" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: desktop/build-log.txt
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBusik-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
