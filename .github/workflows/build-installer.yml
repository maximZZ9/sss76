name: Build Windows installer

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer (NSIS + portable)
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = Get-Content ./build-log.txt -Tail 40
            for ($i = 0; $i -lt $tail.Count; $i += 8) {
              $j = [Math]::Min($i + 7, $tail.Count - 1)
              $part = ($tail[$i..$j] -join "`n") -replace '%', '%25'
              $part = $part -replace "`r", '' -replace "`n", '%0A'
              Write-Output "::error::$part"
            }
            "### Build failed - log tail" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: desktop/build-log.txt
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBusik-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.0.0"
          $files = @(Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName })
          $files += (Resolve-Path ./install-flappy-busik.bat).Path
          $notes = "Скачайте FlappyBusik-Setup-1.0.0.exe и запустите - это обычный установщик (ярлыки, удаление через Панель управления).`n`n- FlappyBusik-Portable-1.0.0.exe - portable-версия без установки.`n- install-flappy-busik.bat - лёгкий автономный установщик (1 файл, без Electron, игра открывается в браузере)."
          # Если настройки репозитория запрещают GITHUB_TOKEN запись (Workflow permissions = read),
          # публикация релиза недоступна — не роняем пайплайн, установщики остаются в артефактах.
          gh release create $tag $files --title "Flappy Бусик v1.0.0 — ТЦК Simulator" --notes $notes --repo $env:GITHUB_REPOSITORY 2>&1 | Out-String | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::Не удалось создать GitHub Release (403). Включите Settings -> Actions -> General -> Workflow permissions -> Read and write, тогда установщики будут публиковаться как релизы. Сейчас они доступны в артефактах запуска."
          }
